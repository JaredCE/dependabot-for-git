# Copy this into any repo that should get dependency-update PRs.
# The only per-repo files needed are this one and dependabot-config.json -
# everything else lives in the published @aat-labs/dependabot-bitbucket-bridge
# package, so there's nothing else to keep in sync across repos.
#
# Repository variables to set (Repo settings -> Pipelines -> Repository variables):
#   BITBUCKET_GIT_TOKEN  - Bitbucket access token, repo READ scope
#   NPM_TOKEN            - npm token for private npmjs.org packages/scopes (optional)
#   BITBUCKET_PR_TOKEN   - Bitbucket access token, repo WRITE + PR scopes

image: node:22

definitions:
  steps:
    - step: &build-cli
        name: Build dependabot CLI
        image: golang:1.26
        script:
          - git clone --depth 1 https://github.com/dependabot/cli.git /tmp/dependabot-cli
          - cd /tmp/dependabot-cli
          - go build -o dependabot ./cmd/dependabot
          - mkdir -p "$BITBUCKET_CLONE_DIR/.bin"
          - mv dependabot "$BITBUCKET_CLONE_DIR/.bin/dependabot"
        artifacts:
          - .bin/**

    - step: &run-updates
        name: Run dependabot update
        image: node:22
        services:
          - docker
        script:
          - export PATH="$BITBUCKET_CLONE_DIR/.bin:$PATH"
          - chmod +x .bin/dependabot
          - npm install -g dependabot-for-git
          - dependabot-run-updates
        artifacts:
          - .dependabot-run/**

    - step: &create-prs
        name: Create/update Bitbucket pull requests
        image: node:22
        script:
          - npm install -g dependabot-for-git
          - dependabot-create-prs

pipelines:
  custom:
    dependabot-update:
      - step: *build-cli
      - step: *run-updates
      - step: *create-prs
